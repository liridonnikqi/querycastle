<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/boot.css" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("qc-theme");
          var theme = saved === "light" || saved === "dark" ? saved : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="app-splash">
      <div class="qc-splash-mark">
        <img src="/icon.svg" alt="QueryCastle" class="qc-splash-icon" />
        <div class="qc-splash-track" aria-hidden="true"><span></span></div>
      </div>
      <div class="qc-loading-label">Loading</div>
    </div>
    <div style="display: contents">%sveltekit.body%</div>
    <script>
      (function() {
        try {
          var theme = document.documentElement.getAttribute("data-theme");
          var bg = theme === "light" ? "#f4f4f5" : "#131417";
          var fg = theme === "light" ? "#71717a" : "#a1a1aa";
          var splash = document.getElementById("app-splash");
          if (splash) {
            splash.style.background = bg;
            var label = splash.querySelector(".qc-loading-label");
            if (label) label.style.color = fg;
          }
        } catch (e) {}
        function hide() {
          document.body.style.background = "";
          var el = document.getElementById('app-splash');
          if (el) { el.style.opacity = '0'; el.style.transition = 'opacity 260ms ease'; setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 260); }
        }
        window.__hideAppSplash = hide;
        setTimeout(function() {
          var el = document.getElementById('app-splash');
          if (el && el.parentNode) hide();
        }, 4000);
      })();
    </script>
  </body>
</html>
