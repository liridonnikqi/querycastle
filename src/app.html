<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/boot.css" />
    <script>
      try {
        const saved = localStorage.getItem('qc-theme');
        const theme = saved === 'light' || saved === 'dark' ? saved : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      } catch {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="app-splash">
      <div class="qc-splash-mark">
        <img src="/icon.svg" alt="QueryCastle" class="qc-splash-icon" />
        <div class="qc-splash-track" aria-hidden="true"><span></span></div>
      </div>
      <div class="qc-loading-label">Loading</div>
    </div>
    <div style="display: contents">%sveltekit.body%</div>
    <script>
      const splash = document.getElementById('app-splash');
      if (splash) {
        const shownAt = Date.now();
        let hidden = false;

        const hide = () => {
          if (hidden) return;
          hidden = true;
          splash.style.opacity = '0';
          splash.style.transition = 'opacity 260ms ease';
          setTimeout(() => splash.remove(), 260);
        };

        window.addEventListener(
          'app:ready',
          () => {
            const wait = Math.max(0, 650 - (Date.now() - shownAt));
            setTimeout(hide, wait);
          },
          { once: true },
        );
        setTimeout(hide, 4000);
      }
    </script>
  </body>
</html>
