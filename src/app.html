<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" style="margin:0;background:#1c1c1e;">
    <div id="app-splash" style="position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#1c1c1e;">
      <img src="/icon.svg" alt="QueryCastle" style="width:56px;height:56px;display:block;" />
      <div style="font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;color:#d1d5db;letter-spacing:0.025em;">Loading</div>
    </div>
    <div style="display: contents">%sveltekit.body%</div>
    <script>
      (function() {
        function hide() {
          var el = document.getElementById('app-splash');
          if (el) { el.style.opacity = '0'; el.style.transition = 'opacity 260ms ease'; setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 260); }
        }
        window.__hideAppSplash = hide;
        // Fallback only if Svelte fails to hide (e.g., JS error) — keep splash until app signals ready
        setTimeout(function() {
          var el = document.getElementById('app-splash');
          if (el && el.parentNode) hide();
        }, 4000);
      })();
    </script>
  </body>
</html>
