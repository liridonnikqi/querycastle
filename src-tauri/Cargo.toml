[package]
name = "querycastle-tauri"
version = "0.1.6"
description = "QueryCastle is a modern SQL client workspace built with Tauri + Svelte + Rust."
edition = "2021"

[lib]
name = "querycastle_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
bytes = "1"
deadpool-postgres = { version = "0.14", features = ["rt_tokio_1"] }
mysql_async = "0.34"
native-tls = "0.2"
postgres-native-tls = "0.5"
r2d2 = "0.8"
r2d2_sqlite = { version = "0.25", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-mcp-bridge = "0.13"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.dev]
debug = 1
incremental = true

# Deps rebuild rarely. Optimize them so `tauri dev` stays snappy
# (drivers, TLS, serde_json) while this crate still compiles at opt-level 0.
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.dev.build-override]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

